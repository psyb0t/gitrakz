name: pipeline

on: [push]

jobs:
  call-go-workflow:
    uses: psyb0t/reusable-github-workflows/.github/workflows/go-workflow.yml@master
    with:
      go_version: "1.26.6"
      dep_command: "make dep"
      lint_command: "make lint"
      test_command: "make test-coverage"
      is_vendored: true
      coverage_file: "coverage-percent.txt"
      # Runs `make generate` and fails if the tree moves — catches a hand-edit
      # to a *.gen.go, or an api.yml / model change whose codegen was never
      # re-run. gitrakz commits the oapi-codegen server + the gorm repositories,
      # both idempotent, so any diff is exactly one of those two.
      has_codegen: true

  badges:
    needs: [call-go-workflow]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    with:
      coverage: true

  # Build + push the multi-arch Docker image to Docker Hub. Tag pushes (v*)
  # ONLY, after the Go lint/test workflow has succeeded.
  publish-image:
    needs: [call-go-workflow]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/gitrakz
      target_platforms: linux/amd64,linux/arm64
      scan_severity: high
      # Report image-scan findings (e.g. Go stdlib CVEs fixed only in a newer
      # toolchain) to the Security tab, but don't fail the run — so the ClawHub
      # publish below, which needs this job, still runs.
      scan_fail_build: false
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Publish the agent skill under .agents/ to ClawHub on tag pushes, after the
  # release image is out.
  publish-to-clawhub:
    needs: [publish-image]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
