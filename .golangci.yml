version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - err113
    - mnd
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - importas
    - interfacebloat
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tagalign
    - tagliatelle
    - testableexamples
    # - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint

  settings:
    ireturn:
      # Constructors return interfaces by design, so allow the ones this project
      # returns on purpose: the transform registry's Factory contract
      # (Primitive), the service registry (Service), the gh-client seam
      # (GHClient, real vs mock), maroto's row builder (core.Row), plus generic
      # type-parameter returns. Keeps the golangci defaults alongside.
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
        - Primitive
        - Service
        - GHClient
        - core\.Row
        # Every oapi-codegen strict handler returns a <Op>ResponseObject
        # interface by construction — that IS the StrictServerInterface shape.
        - ResponseObject
    lll:
      line-length: 80
      tab-width: 4
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/stretchr/testify/
            - github.com/pkg/errors
            - github.com/spf13/viper
            - github.com/sirupsen/logrus
            - github.com/google/uuid
            - github.com/psyb0t
            - github.com/joho/godotenv
            - github.com/spf13/cobra
            - modernc.org/sqlite
            - github.com/johnfercher/maroto
            - gorm.io
            - github.com/ncruces/go-sqlite3
            - github.com/modelcontextprotocol/go-sdk

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
          - maintidx
          - wrapcheck
      # The psyb0t constants convention places shared vocabulary in generically
      # named packages under common/ (types/, consts/, errors/). revive's
      # meaningless-package-names check is wrong for this project there.
      - path: internal/pkg/(common|http/api)/
        linters:
          - revive
        text: avoid meaningless package names

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
